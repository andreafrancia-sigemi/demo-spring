name: Java CI and Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Esecuzione e Report dei Test Java
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Necessario per pubblicare il report dei test nelle PR

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Velocizza il download delle dipendenze

      - name: Esegui i test con Maven
        run: mvn -B test --file pom.xml

      - name: Pubblica il Report dei Test
        uses: dorny/test-reporter@v1
        if: always() # Importante: pubblica il report anche se qualche test fallisce
        with:
          name: Report Test JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
